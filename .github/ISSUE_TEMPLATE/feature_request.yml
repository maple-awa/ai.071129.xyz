name: 功能建议
description: 提交新功能、流程优化或体验改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请尽量说明真实使用场景，避免只描述“想要什么”而不说明“为什么需要”。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或使用场景
      description: 先描述当前痛点，再描述建议内容
      placeholder: 例如：在管理多个 Key 时，很难快速找到最近使用的配置
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      placeholder: 例如：希望增加搜索、筛选和最近使用排序
    validations:
      required: true

  - type: input
    id: ai_scope
    attributes:
      label: 相关模型 ID / 提供商 / 接口
      description: 如果建议与某类模型、某个上游或某种接口有关，请尽量写清楚
      placeholder: 例如：OpenAI Compatible + /v1/chat/completions + gpt-4o-mini

  - type: textarea
    id: benefit
    attributes:
      label: 预期收益
      description: 这个改动能解决什么问题，或带来什么价值
      placeholder: 例如：减少查找时间，降低误操作概率
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 建议优先级
      description: 请按你的实际使用影响选择
      options:
        - 低
        - 中
        - 高
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否有临时绕过方案，或你考虑过的其他实现方式

  - type: textarea
    id: references
    attributes:
      label: 参考资料
      description: 可附上截图、原型、其他产品案例或相关链接

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已经检查过是否存在重复建议
          required: true
