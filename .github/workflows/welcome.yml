name: Welcome

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: First interaction
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            感谢首次提交反馈。

            这是 `ai.071129.xyz` 主站的反馈仓库。为了加快处理，请尽量补充这些信息：
            - 问题页面或功能入口
            - 复现步骤
            - 期望结果与实际结果
            - 截图、报错或日志

            如果这是功能建议，也请补充实际使用场景和预期收益。
          pr-message: |
            感谢首次提交 PR。

            请确认这次修改：
            - 已关联对应 Issue
            - 范围足够单一、便于审阅
            - 已补充必要验证说明

            如果是较大改动，建议先在 Issue 中完成讨论。
